<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra Mobile — UI モックアップ</title>
<style>
:root{
  --color-bg:#faf9f5; --color-bg-sidebar:#f0eee6; --color-bg-elevated:#ffffff; --color-bg-input:#ffffff; --color-bg-hover:#ebe8de;
  --color-border:#e6e2d6; --color-border-strong:#d6d1c3;
  --color-fg:#3d3929; --color-fg-strong:#1f1e1b; --color-fg-muted:#5e5a4c; --color-fg-faint:#78735f;
  --color-accent:#b95a3a; --color-accent-pressed:#a24f30; --color-on-accent:#ffffff; --color-accent-text:#b5532f;
  --color-success:#2f7d4f; --color-warning:#9c610c; --color-danger:#b3261e; --color-running:#3b6db3;
  --color-scrim:rgba(31,30,27,.32); --color-shadow:#3d3929;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-serif:Georgia,"Hiragino Mincho ProN",serif;
  --font-mono:Menlo,Consolas,monospace;
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px; --space-xl:24px; --space-2xl:48px; --space-3xl:64px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px;
  --shadow-1:0 1px 2px rgba(61,57,41,.05); --shadow-2:0 2px 10px rgba(61,57,41,.06); --shadow-3:0 8px 28px rgba(61,57,41,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --color-bg:#1f1e1b; --color-bg-sidebar:#262420; --color-bg-elevated:#2b2924; --color-bg-input:#2b2924; --color-bg-hover:#3a372f;
    --color-border:#3a372f; --color-border-strong:#4a463c;
    --color-fg:#e8e4d8; --color-fg-strong:#f5f2ea; --color-fg-muted:#b3ad9c; --color-fg-faint:#8d8776;
    --color-accent:#d07855; --color-accent-pressed:#b95a3a; --color-on-accent:#1f1e1b; --color-accent-text:#d99a7f;
    --color-success:#6fb389; --color-warning:#d19a4a; --color-danger:#e08a84; --color-running:#8aa9d4;
    --color-scrim:rgba(0,0,0,.5); --color-shadow:#000000;
  }
}

/* ---------- ページ（モックアップの台紙） ---------- */
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--color-bg-sidebar);color:var(--color-fg);font-family:var(--font-body);font-size:15px;line-height:1.65;padding:var(--space-xl) var(--space-md)}
.page-head{max-width:920px;margin:0 auto var(--space-xl)}
.page-head h1{font-family:var(--font-serif);color:var(--color-fg-strong);font-size:30px;font-weight:500;line-height:1.25;margin:0 0 var(--space-sm)}
.page-head p{margin:0 0 var(--space-sm);max-width:70ch;color:var(--color-fg-muted);font-size:13px;line-height:18px}
.screens{display:flex;flex-wrap:wrap;gap:var(--space-2xl) var(--space-xl);justify-content:center;align-items:flex-start}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:var(--space-md);max-width:100%}
figcaption{font-size:13px;line-height:18px;color:var(--color-fg-muted);text-align:center;max-width:390px}
figcaption b{display:block;color:var(--color-fg-strong);font-size:15px;font-weight:600}

/* ---------- 端末フレーム ---------- */
.phone{position:relative;width:390px;height:844px;max-width:100%;background:var(--color-bg);border:1px solid var(--color-border-strong);border-radius:44px;box-shadow:var(--shadow-3);overflow:hidden;display:flex;flex-direction:column}
.phone.small{width:360px;height:740px}
.statusbar{flex:none;height:44px;padding:0 var(--space-xl);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--color-fg-strong);font-variant-numeric:tabular-nums}
.statusbar .sys{font-size:12px;letter-spacing:1px}
.home-indicator{flex:none;width:134px;height:5px;border-radius:var(--radius-pill);background:var(--color-fg-strong);margin:var(--space-sm) auto;opacity:.85}

/* ---------- ヘッダ ---------- */
.header{flex:none;height:56px;padding:0 var(--space-md) 0 var(--space-xs);display:flex;align-items:center;gap:var(--space-xs);border-bottom:1px solid var(--color-border)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--color-fg-strong);background:transparent;border:0;font-family:var(--font-body)}
.icon-btn:active{background:var(--color-bg-hover)}
.header-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.header-title .t{font-family:var(--font-serif);font-size:17px;font-weight:500;color:var(--color-fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title .t.page{font-size:22px}
.header-title .s{font-size:12px;color:var(--color-fg-faint);display:flex;align-items:center;gap:var(--space-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 共通部品 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 var(--space-lg);border-radius:var(--radius-md);font-size:15px;font-weight:600;line-height:1;font-family:var(--font-body);border:1px solid transparent;text-decoration:none}
.btn-primary{background:var(--color-accent);color:var(--color-on-accent)}
.btn-primary:active{background:var(--color-accent-pressed)}
.btn-secondary{background:var(--color-bg-elevated);color:var(--color-fg-strong);border-color:var(--color-border-strong)}
.btn-ghost{background:transparent;color:var(--color-accent-text);padding:0 var(--space-sm)}
.btn-block{width:100%}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.send:focus-visible,.nav-row:focus-visible{outline:2px solid var(--color-accent-text);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;line-height:1;border:1px solid var(--color-border);color:var(--color-fg-muted);background:var(--color-bg-elevated);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.dot.running{background:var(--color-running)}
.dot.warning{background:var(--color-warning)}
.dot.success{background:var(--color-success)}
.dot.danger{background:var(--color-danger)}
.avatar{flex:none;width:26px;height:26px;border-radius:13px;background:rgba(185,90,58,.12);color:var(--color-accent);display:inline-flex;align-items:center;justify-content:center;font-size:14px}

/* ---------- 承認待ちの帯 ---------- */
.band{flex:none;display:flex;align-items:center;gap:var(--space-sm);padding:0 var(--space-xs) 0 var(--space-md);background:var(--color-bg-sidebar);border-bottom:1px solid var(--color-border);font-size:13px;color:var(--color-fg)}
.band .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 会話 ---------- */
.chat{flex:1;min-height:0;overflow-y:auto;padding:var(--space-lg) var(--space-md);display:flex;flex-direction:column;gap:var(--space-lg)}
.user-wrap{display:flex;justify-content:flex-end;padding-left:var(--space-2xl)}
.user-bubble{background:var(--color-bg-hover);border-radius:20px;border-bottom-right-radius:6px;padding:10px 14px;color:var(--color-fg);font-size:15px;line-height:22px;max-width:100%}
.agent-turn{display:flex;flex-direction:column;gap:var(--space-sm)}
.agent-head{display:flex;align-items:center;gap:var(--space-sm)}
.agent-name{color:var(--color-fg-muted);font-size:13px;font-weight:600}
.agent-time{color:var(--color-fg-faint);font-size:12px;font-family:var(--font-mono)}
.agent-body{padding-left:34px;font-size:15px;line-height:23px;display:flex;flex-direction:column;gap:var(--space-sm);color:var(--color-fg)}
.tool-line{font-family:var(--font-mono);font-size:12px;line-height:18px;color:var(--color-fg-faint)}
.code{font-family:var(--font-mono);font-size:12px;line-height:18px;background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-sm) var(--space-md);color:var(--color-fg-strong);white-space:pre;overflow-x:auto}
.inline-actions{display:flex;gap:var(--space-sm);flex-wrap:wrap}

/* ---------- 入力欄 ---------- */
.composer-wrap{flex:none;padding:var(--space-sm) var(--space-md) 0}
.composer{background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-sm) var(--space-sm) var(--space-sm) var(--space-md);box-shadow:var(--shadow-2)}
.composer .area{min-height:44px;max-height:160px;color:var(--color-fg-faint);font-size:15px;line-height:21px;padding:var(--space-sm) 0}
.composer .area.filled{color:var(--color-fg)}
.composer .bar{display:flex;align-items:center;gap:var(--space-sm)}
.chipset{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.chipset.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chipset.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:var(--radius-pill);border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-fg-muted);font-family:var(--font-mono);font-size:12px;line-height:1;white-space:nowrap}
.chip.changed{border-color:var(--color-accent-text);color:var(--color-accent-text)}
.send{flex:none;width:34px;height:34px;border-radius:var(--radius-sm);background:var(--color-accent);color:var(--color-on-accent);display:inline-flex;align-items:center;justify-content:center;font-size:17px;border:0}
.send.disabled{opacity:.4}
.hint{font-size:12px;color:var(--color-fg-faint);text-align:center;padding-top:6px;line-height:1.4}

/* ---------- ドロワー ---------- */
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.drawer-layer{position:absolute;inset:0;display:flex}
.drawer{width:82%;max-width:320px;height:100%;background:var(--color-bg-sidebar);display:flex;flex-direction:column;padding:var(--space-md) var(--space-sm) var(--space-sm)}
.drawer-scrim{flex:1;background:var(--color-scrim)}
.drawer-brand{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-sm) var(--space-lg)}
.drawer-brand .name{font-family:var(--font-serif);font-size:22px;font-weight:500;color:var(--color-fg-strong);line-height:1.3}
.drawer-new{margin:0 var(--space-xs) var(--space-md)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto}
.nav-label{font-size:12px;color:var(--color-fg-faint);padding:var(--space-md) var(--space-md) var(--space-xs)}
.nav-row{display:flex;align-items:center;gap:var(--space-md);height:48px;padding:0 var(--space-md);border-radius:var(--radius-md);color:var(--color-fg);font-size:15px;font-weight:500;text-decoration:none}
.nav-row .ic{width:20px;text-align:center;font-size:17px;color:var(--color-fg-muted)}
.nav-row.active{background:var(--color-bg-hover);color:var(--color-fg-strong)}
.nav-row.active .ic{color:var(--color-accent-text)}
.nav-row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-row .cnt{font-family:var(--font-mono);font-size:12px;color:var(--color-fg-faint)}
.account{display:flex;align-items:center;gap:var(--space-md);min-height:56px;padding:var(--space-sm) var(--space-md);border-top:1px solid var(--color-border);margin-top:var(--space-sm)}
.account .who{flex:1;min-width:0;line-height:1.3}
.account .who b{display:block;font-size:15px;font-weight:600;color:var(--color-fg-strong)}
.account .who span{font-size:12px;color:var(--color-fg-faint)}
.initial{flex:none;width:32px;height:32px;border-radius:16px;background:var(--color-bg-hover);color:var(--color-fg-strong);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}

/* ---------- カンバン ---------- */
.page-body{flex:1;min-height:0;overflow-y:auto;padding:var(--space-lg) var(--space-md) var(--space-xl);display:flex;flex-direction:column;gap:var(--space-xl)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--space-md);border-radius:var(--radius-pill);border:1px solid var(--color-border);background:var(--color-bg-elevated);font-size:13px;font-weight:600;color:var(--color-fg-muted)}
.tab.active{border-color:var(--color-accent-text);color:var(--color-accent-text)}
.col{display:flex;flex-direction:column;gap:var(--space-md)}
.col-head{display:flex;align-items:center;gap:var(--space-sm)}
.col-head h2{margin:0;font-size:17px;font-weight:600;line-height:1.4;color:var(--color-fg-strong)}
.col-head .n{font-family:var(--font-mono);font-size:12px;color:var(--color-fg-faint)}
.card{background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:var(--space-sm)}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.4;color:var(--color-fg-strong)}
.card p{margin:0;font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.card .meta{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap}
.card .meta .mono{font-family:var(--font-mono);font-size:12px;color:var(--color-fg-faint)}

/* ---------- ログイン ---------- */
.login{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--space-xl) var(--space-xl) var(--space-lg)}
.login .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--space-md)}
.logo-wrap{width:72px;height:72px;border-radius:var(--radius-lg);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--color-bg-elevated);border:1px solid var(--color-border);box-shadow:var(--shadow-1)}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.logo-fallback{width:72px;height:72px;border-radius:36px;font-size:32px}
.display{font-family:var(--font-serif);font-size:30px;font-weight:500;line-height:1.25;color:var(--color-fg-strong);margin:var(--space-sm) 0 0}
.lead{font-size:15px;line-height:23px;color:var(--color-fg-muted);margin:0;max-width:30ch}
.login .actions{display:flex;flex-direction:column;gap:var(--space-md)}
.divider{display:flex;align-items:center;gap:var(--space-md);font-size:12px;color:var(--color-fg-faint)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--color-border)}
.terms{font-size:12px;line-height:1.5;color:var(--color-fg-faint);text-align:center;margin:var(--space-sm) 0 0}
.terms a{color:var(--color-accent-text)}

/* ---------- レスポンシブ ---------- */
@media (max-width:430px){
  body{padding:var(--space-lg) var(--space-sm)}
  .page-head h1{font-size:22px}
  .phone,.phone.small{width:100%;max-width:390px;height:780px;border-radius:var(--radius-xl)}
}
@media (max-width:360px){
  .chipset{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .user-wrap{padding-left:var(--space-xl)}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.icon-btn,.chip,.nav-row{transition:background-color .15s ease}
}
</style>
</head>
<body>

<header class="page-head">
  <h1>Orchestra Mobile — UI モックアップ</h1>
  <p>前提: 実装（Expo / React Native）の画面構成を、<code>.division/DESIGN.html</code> のトークンで 390×844 の端末フレームに描いた静的モックアップです。操作要素は見た目だけで、実際には動きません。</p>
  <p>画面: ① ログイン ② ホーム（会話） ③ ナビゲーションドロワー ④ カンバン ⑤ 小さい画面（360px）</p>
</header>

<main class="screens">

  <!-- ① ログイン -->
  <figure data-screen="login">
    <div class="phone" role="img" aria-label="ログイン画面のモックアップ">
      <div class="statusbar"><span>9:41</span><span class="sys">▂▄▆ 5G ▮</span></div>
      <div class="login">
        <div class="hero">
          <span class="logo-wrap">
            <img src="../../assets/logo.png" alt="Orchestra のロゴ" width="72" height="72"
                 onerror="this.parentNode.hidden=true;this.parentNode.nextElementSibling.hidden=false">
          </span>
          <span class="avatar logo-fallback" hidden>✻</span>
          <h2 class="display">Orchestra</h2>
          <p class="lead">手元の PC やクラウドのエージェントに、スマホから話しかけて仕事を進めます。</p>
        </div>
        <div class="actions">
          <a class="btn btn-primary btn-block" href="#home">Division でログイン</a>
          <div class="divider">または</div>
          <a class="btn btn-secondary btn-block" href="#home">接続コードで PC とつなぐ</a>
          <p class="terms">続けると <a href="#terms">利用規約</a> と <a href="#privacy">プライバシーポリシー</a> に同意したものとみなされます。</p>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
    <figcaption><b>① ログイン</b>主操作は「Division でログイン」の 1 つだけ。接続コードは Secondary に置いています。</figcaption>
  </figure>

  <!-- ② ホーム（会話） -->
  <figure data-screen="home" id="home">
    <div class="phone" role="img" aria-label="ホーム（会話）画面のモックアップ">
      <div class="statusbar"><span>9:41</span><span class="sys">▂▄▆ 5G ▮</span></div>
      <div class="header">
        <button class="icon-btn" aria-label="メニューを開く">☰</button>
        <div class="header-title">
          <span class="t">Claude 風の配色に整える</span>
          <span class="s"><span class="dot success"></span>MacBook Pro に接続中 · orchestra-mobile</span>
        </div>
        <span class="badge"><span class="dot running"></span>作業中</span>
      </div>
      <div class="band">
        <span class="dot warning"></span>
        <span class="msg">承認待ち 1 件 — <b>src/theme.ts</b> の書き換え</span>
        <a class="btn btn-ghost" href="#approve">確認する</a>
      </div>
      <div class="chat">
        <div class="user-wrap"><div class="user-bubble">この画面の配色を Claude 風に整えてください。背景は暖かい色で、余白は広めに。</div></div>
        <div class="agent-turn">
          <div class="agent-head"><span class="avatar">✻</span><span class="agent-name">エージェント</span><span class="agent-time">9:38</span></div>
          <div class="agent-body">
            <div>了解しました。地は暖かいオフホワイトに、主な操作だけテラコッタを使います。</div>
            <div class="tool-line">● ツールを 3 回実行　⎿ 読み取り・検索・置換</div>
            <div class="code">colors.bg     = '#faf9f5'
colors.accent = '#b95a3a'</div>
            <div><code>src/theme.ts</code> を書き換えてよいか確認させてください。</div>
            <div class="inline-actions">
              <a class="btn btn-primary" href="#approve">承認する</a>
              <a class="btn btn-secondary" href="#reject">却下</a>
            </div>
          </div>
        </div>
        <div class="user-wrap"><div class="user-bubble">OK、進めて。</div></div>
      </div>
      <div class="composer-wrap">
        <div class="composer">
          <div class="area">エージェントに頼みたいことを書く…</div>
          <div class="bar">
            <div class="chipset">
              <span class="chip" tabindex="0">☁ クラウド ▾</span>
              <span class="chip" tabindex="0">⑂ orchestra-mobile ▾</span>
              <span class="chip changed" tabindex="0">⚙ Opus ▾</span>
            </div>
            <button class="send disabled" aria-label="送信" disabled>↑</button>
          </div>
        </div>
        <div class="hint">既定値の設定は畳み、変更した設定だけを表示しています</div>
      </div>
      <div class="home-indicator"></div>
    </div>
    <figcaption><b>② ホーム（会話）</b>ヘッダ 56、承認待ちの細い帯、会話ログ、入力欄（角丸 24・影 2）。入力から送信までは 2 操作です。</figcaption>
  </figure>

  <!-- ③ ドロワー -->
  <figure data-screen="drawer">
    <div class="phone" role="img" aria-label="ナビゲーションドロワーを開いた画面のモックアップ">
      <div class="statusbar"><span>9:41</span><span class="sys">▂▄▆ 5G ▮</span></div>
      <div class="stage">
        <div class="header">
          <span class="icon-btn">☰</span>
          <div class="header-title"><span class="t">Orchestra</span><span class="s">接続中</span></div>
        </div>
        <div class="chat">
          <div class="user-wrap"><div class="user-bubble">ビルドを流して</div></div>
        </div>
